# Local override (not used by Dokploy): publishes the API on 8989 and the console on 5173.
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f compose.local.yml up -d --wait

services:
  api:
    ports:
      - "8989:8080"
    environment:
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:7357,http://127.0.0.1:7357

  backend:
    ports:
      - "5173:8080"
    environment:
      API_BASE_URL: http://localhost:8989
