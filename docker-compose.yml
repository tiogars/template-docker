# Dokploy deployment of the template application (Docker Compose service, compose path: ./docker-compose.yml).
# Images are published to GHCR by the GitHub Actions workflows of each repository.
# No host port is published: assign the domains in Dokploy (backend -> 8080, api -> 8080).
# Every service is explicitly attached to the compose "default" network: Dokploy appends
# "dokploy-network" to the services that get a domain, and older versions then dropped the
# implicit default network, which cut the api off from postgres.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template}
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Executed only when the data volume is created for the first time.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/tiogars/template-java-api:${API_IMAGE_TAG:-latest}
    # Without it, a redeploy keeps the locally cached "latest" image.
    pull_policy: always
    restart: unless-stopped
    networks:
      - default
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-template}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-template}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD must be set}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set (at least 32 characters)}
      APP_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-3600}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS must be set to the console URL}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The JRE image ships without curl/wget: probe /actuator/health with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5

  backend:
    image: ghcr.io/tiogars/template-react-backend:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - default
    environment:
      # Served at runtime through /config.js; must be the public URL of the api service.
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL must be set to the public API URL}
      DOCS_BASE_URL: ${DOCS_BASE_URL:-https://tiogars.github.io/template-docs-mkdocs/}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-https://github.com/tiogars/template-react-backend}
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
